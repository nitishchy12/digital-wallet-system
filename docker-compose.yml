version: "3.8"

services:
  backend:
    build: ./backend
    container_name: wallet-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: wallet-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  mongo:
    image: mongo:6
    container_name: wallet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
