apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: wallet
  labels:
    app.kubernetes.io/name: digital-wallet
    app.kubernetes.io/component: backend
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  RUNNING_IN_DOCKER: "true"
  MONGODB_URI: "mongodb://mongo:27017/digital-wallet"
  JWT_EXPIRE: "15m"
  JWT_REFRESH_EXPIRE: "7d"
  FRONTEND_URL: "/"
