apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: wallet
  labels:
    app.kubernetes.io/name: digital-wallet
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-strong-access-token-secret"
  JWT_REFRESH_SECRET: "replace-with-a-strong-refresh-token-secret"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USER: "replace-with-email-user"
  EMAIL_PASS: "replace-with-email-app-password"
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
