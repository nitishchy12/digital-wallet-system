apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: wallet
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  RUNNING_IN_DOCKER: "true"
  MONGODB_URI: "mongodb://mongo:27017/digital-wallet"
  JWT_EXPIRE: "15m"
  JWT_REFRESH_EXPIRE: "7d"
  # Replace this after your AWS load balancer DNS name or custom domain is ready.
  FRONTEND_URL: "http://localhost"
