apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: wallet
type: Opaque
stringData:
  # Replace every value before applying this file to a real production cluster.
  JWT_SECRET: "change-me-to-a-long-random-access-token-secret"
  JWT_REFRESH_SECRET: "change-me-to-a-long-random-refresh-token-secret"

  # Required for signup OTP and forgot-password emails.
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USER: "your-email@gmail.com"
  EMAIL_PASS: "your-app-password"

  # Optional. Mock payments still work without real Razorpay credentials.
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
